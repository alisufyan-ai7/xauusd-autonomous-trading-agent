name: v12-public-original-source-provenance-screen

on:
  pull_request:
    paths:
      - "research/public_source/**"
      - ".github/workflows/v12-public-origin-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-original-bytes-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline public-origin allowlist tests
        run: python -m unittest discover -s research/public_source/tests -v
      - name: Retrieve public official HTTPS originals only
        run: |
          python research/public_source/original_body_fetch.py --ephemeral-output "${RUNNER_TEMP}/v12-authority-raw"
      - name: Ephemeral private GitHub Actions artifact (not admissible by itself)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-original-source-screen-${{ github.run_id }}
          path: ${{ runner.temp }}/v12-authority-raw
          if-no-files-found: warn
          retention-days: 90
