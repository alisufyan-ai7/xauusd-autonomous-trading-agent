name: demo-admit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "demo_adapter/**"
      - ".github/workflows/demo-admit.yml"
      - "phase0/roadmap/DEMO_ADMIT_IMPLEMENTATION_REGISTRATION_2026-10-18.json"

permissions:
  contents: read

jobs:
  offline-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: demo_adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: demo_adapter/pyproject.toml
      - name: Install demo validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Type check
        run: python -m mypy src/xauusd_demo
      - name: Offline tests only
        run: python -m pytest -q
      - name: Prove package boundary
        run: python scripts/verify_package_boundary.py
      - name: Build separate demo wheel
        run: python -m build
