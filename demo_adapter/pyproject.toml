[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-demo-adapter"
version = "0.1.0.dev0"
description = "Separately packaged, demo-only XAUUSD MT5 execution adapter"
requires-python = ">=3.12"
dependencies = [
  "MetaTrader5==5.0.6090; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "mypy>=1.11,<2",
  "ruff>=0.7,<1",
  "build>=1.2,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xauusd_demo"]
mypy_path = "src"
